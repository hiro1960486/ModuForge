name: Windows GUI startup smoke
on:
  pull_request:
    paths:
      - 'scripts/smoke_root_gui.py'
      - '.github/workflows/windows-gui-smoke.yml'
      - '00_shared/**'
      - '0[1-8]_*/**'
      - 'run_component.py'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui-smoke:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install module runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run eight modules offscreen (no file operations)
        run: python scripts/smoke_root_gui.py
