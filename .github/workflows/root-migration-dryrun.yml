name: Root migration dry-run
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile migration tools
        run: python -m py_compile scripts/prepare_root_layout.py scripts/audit_flat_layout.py
      - name: Verify copy-only migration state
        run: python scripts/audit_flat_layout.py
