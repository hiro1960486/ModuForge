name: Safe layout migration validation
on:
  pull_request:
    paths:
      - 'scripts/restructure_safe.py'
      - 'scripts/validate_staging.py'
      - '.github/workflows/validate-migration.yml'
      - 'FW33/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-and-tests:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify original test suite
        run: python FW33/run_tests.py
      - name: Inspect without changes
        run: python scripts/restructure_safe.py
      - name: Create isolated staging copy
        run: python scripts/restructure_safe.py --stage
      - name: Verify staging structure and test suite
        run: python scripts/validate_staging.py
